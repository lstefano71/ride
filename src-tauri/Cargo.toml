[package]
name = "ride"
version = "4.8.0"
description = "Cross-platform IDE for Dyalog APL (Tauri shell)"
authors = ["Dyalog Ltd"]
license = "MIT"
repository = "https://github.com/Dyalog/ride"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ride_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "macros"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
x509-parser = "0.18"
serde_json = "1"
ring = "0.17"
dirs = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tauri-plugin-dialog = "2.8.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
