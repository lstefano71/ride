[package]
name = "ride"
version = "4.8.0"
description = "Cross-platform IDE for Dyalog APL (Tauri shell)"
authors = ["Dyalog Ltd"]
license = "MIT"
repository = "https://github.com/Dyalog/ride"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ride_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
