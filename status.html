<!doctype html>
<html>
<head>
<meta charset=utf-8>
<title>Status Output</title>
<link rel=stylesheet href='style/ride-base.css'>
<link rel=stylesheet class=theme id=theme_dark href='style/dark-theme.css'>
<link rel=stylesheet class=theme id=theme_light href='style/light-theme.css'>
<script src=src/host/electron.js></script><script src=src/host/tauri.js></script>
<script>
    const { ipc: hostIpc, win: hostWin } = D.host;
    const toMain = (type, data) => hostIpc.send('main', type, data);
    D.host.ready.then(() => {
      hostWin.onCloseRequested(hostWin.current(), () => {
        toMain('statClose');
        return false;
      });
      hostIpc.on('add', add);
      hostIpc.on('setTheme', (theme) => {
        document.getElementById('theme_dark').disabled = theme !== 'dark';
        document.getElementById('theme_light').disabled = theme !== 'light';
      });
      hostIpc.on('caption', (caption) => {
        document.title = `Status Output - ${caption}`;
      });
      toMain('statCreated');
    });

    window.onkeydown = function (x) {
      if (x.which === 27) toMain('statClose');
    };

    const d = document;
    function add(x) {
      const b = d.body;
      const s = d.getElementById('status');
      const e = d.createElement('div');
      e.className = 'm t' + x.flags;
      e.textContent = x.text;
      s.appendChild(e);
      b.scrollTop = b.scrollHeight;
    }
</script>
</head>
<body id=status_body>
<div id=status></div>
</body>
</html>
