<!doctype html>
<html>
<head>
<meta charset=utf-8>
<title>3500 I-beam</title>
<script src=src/host/electron.js></script><script src=src/host/tauri.js></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!-- The interpreter's HTML runs sandboxed in an opaque origin, out of reach of the host adapters. -->
<iframe id=content sandbox="allow-scripts allow-popups allow-forms allow-modals"></iframe>
<script>
  const { ipc: hostIpc, win: hostWin } = D.host;
  D.host.ready.then(() => {
    hostIpc.on('html3500', ({ title, html }) => {
      document.title = title;
      hostWin.setTitle(hostWin.current(), title);
      document.getElementById('content').srcdoc = html;
      hostWin.show(hostWin.current()).then(() => hostWin.focus(hostWin.current()));
    });
    hostIpc.send('main', 'html3500Get');
  });
</script>
</body>
</html>
